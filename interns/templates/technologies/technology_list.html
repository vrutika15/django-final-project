{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Technologies</h2>
    <a href="{% url 'interns:technology_add' %}" class="btn btn-primary mb-3">Add Technology</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th style="width: 20%">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for tech in technologies %}
            <tr>
                <td>{{ tech.name }}</td>
                <td>
                    <a href="{% url 'interns:technology_edit' tech.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'interns:technology_delete' tech.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">No technologies added yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
