{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-dark mb-4">Technologies</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="{% url 'interns:technology_add' %}" class="btn btn-outline-success">
                    <i class="fas fa-plus me-1"></i> Add Technology
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th class="text-center" style="width: 20%">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for tech in technologies %}
                        <tr>
                            <td>{{ tech.name }}</td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center align-items-center gap-2">
                                    <a href="{% url 'interns:technology_edit' tech.pk %}" 
                                       class="btn btn-sm btn-outline-warning d-flex align-items-center justify-content-center"
                                       title="Edit" style="width: 36px; height: 36px;">
                                        <i class="fas fa-pen-to-square"></i>
                                    </a>
                                    <a href="{% url 'interns:technology_delete' tech.pk %}" 
                                       class="btn btn-sm btn-outline-danger d-flex align-items-center justify-content-center"
                                       title="Delete" style="width: 36px; height: 36px;">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-center text-muted">No technologies added yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
