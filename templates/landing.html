<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); min-height: 100vh; display: flex; align-items: center;">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card p-4 shadow-lg">
            <h3 class="mb-3 text-center">Choose Portal</h3>
            <form method="post" class="d-grid gap-2">
              {% csrf_token %}
              <button name="choice" value="user" class="btn btn-primary">User</button>
              <a href="{% url 'login' %}" class="btn btn-outline-primary">Admin</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
